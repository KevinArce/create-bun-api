[package]
name = "bun-cli"
version = "0.4.0"
edition = "2021"
authors = ["Kevin Arce <arcex@proton.me>"]
license = "MIT OR Apache-2.0"
description = "Retired. This crate no longer creates projects; use `bun create bun-api <dir>` (npm package create-bun-api) instead."
readme = "README.md"
homepage = "https://www.npmjs.com/package/create-bun-api"
repository = "https://github.com/KevinArce/create-bun-api"
