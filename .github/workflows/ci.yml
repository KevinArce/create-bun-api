name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly: catches upstream breakage (Bun, Elysia) before users do.
    - cron: "0 6 * * 1"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 1.4.0 is MIN_BUN_VERSION in src/manifest.ts; latest catches upcoming breakage.
        bun: ["1.4.0", latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Configure git identity for generated projects
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - run: bun run ci
